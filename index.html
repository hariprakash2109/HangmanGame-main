<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HangMan Game</title>
    <link rel="stylesheet" href="style.css">
    <!-- script -->
    <script src="wordlist.js" defer></script>
    <script src="script.js" defer></script>
    <style>
        footer {
            text-align: center;
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #f1f1f1;
            padding: 10px 0;
            font-size: 14px;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="main">
      <div class="game">
        <div class="left">
          <img class="img" src="images/hangman-0.svg" />
          <h1>HANGMAN GAME</h1>
        </div>
        <div class="right">
          <ul class="word-display"></ul>
          <h4>
            Hint:Lorem ipsum dolor sit, amet consectetur adipisicing elit.
            Laborum, ipsum!
          </h4>
          <p>
            Incorrect guesses:
            <span class="chance" style="color: red">0/6</span>
          </p>
          <div class="keyboard"></div>
        </div>
      </div>
      <div class="GameOver">
        <img class="gameoverImg" src="images/lost.gif" />
        <h3>Game Over!</h3>
        <h6>
          The Correct Word Was:<span class="answer" style="color: red"
            >Jazz</span
          >
        </h6>
        <button onclick="location.reload()">PLAY AGAIN</button>
      </div>
    </div>

    <footer>
      Copyright © Hari Prakash S - All rights reserved - 2024
    </footer>
</body>
</html>
